<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palette Pantry · 色彩食谱</title><style>:root{--a:#a85d39;--m:#755f50}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f5eadc,#d9b99d);color:#33241c;font:16px/1.6 system-ui,"Microsoft YaHei"}main{width:min(1180px,92vw);margin:auto;padding:48px 0 72px}.top{display:flex;justify-content:space-between}.eyebrow{color:var(--a);letter-spacing:.2em;font-size:12px;font-weight:800}.pill{border:1px solid #8b5a3d45;border-radius:99px;padding:7px 13px;color:var(--m);font-size:12px}h1{font:800 clamp(44px,8vw,94px)/.9 Georgia;margin:42px 0 18px}.lead{color:var(--m);font-size:19px;max-width:700px}.layout{display:grid;grid-template-columns:1fr .9fr;gap:22px;margin-top:48px}.card{border:1px solid #8b5a3d30;border-radius:28px;background:#fffaf1d9;box-shadow:0 20px 60px #80533422;padding:24px}.palette{min-height:430px;display:flex;flex-direction:column;justify-content:center;align-items:center}.swatch{width:210px;height:210px;border-radius:50%;background:#d8cabb;border:14px solid #f1e4d0;box-shadow:0 18px 40px #80533424}.name{font:700 32px Georgia;color:var(--a);margin-top:24px}.recipe{margin-top:14px;text-align:center;color:var(--m);font-size:14px;line-height:1.7;max-width:360px}.recipe strong{display:block;color:var(--a);font-size:18px;margin-bottom:4px}.control{display:flex;flex-direction:column;gap:16px}.preview{width:100%;aspect-ratio:16/10;background:#342820;border-radius:18px;object-fit:cover}.btn{border:0;border-radius:12px;padding:12px 17px;background:var(--a);color:#fff8ee;font-weight:800;cursor:pointer}.btn.alt{background:#ead8c2;color:#815035;margin-left:8px}.status{color:var(--a);font-weight:700;font-size:18px}.note{color:var(--m);font-size:13px}@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style><main><div class="top"><span class="eyebrow">PALETTE PANTRY / VISUAL RECIPE</span></div><h1>摄像头识别物体颜色</h1><p class="lead">把镜头里的颜色转换成虚构食谱卡</p><section class="layout"><div class="card palette"><div id="swatch" class="swatch"></div><div id="name" class="name">等待今天的主色</div><div id="recipe" class="recipe">识别颜色后推荐食谱</div></div><div class="card control"><video id="cam" class="preview" autoplay muted playsinline></video><div><button id="go" class="btn">开启摄像头</button><button id="recognize" class="btn alt" disabled>开始识别</button></div><div id="msg" class="status">准备取色</div><p class="note">摄像头画面只在本地浏览器分析，不会上传。</p></div></section></main><script>const recognize=document.getElementById("recognize");let streamReady=false;const recipes=[{name:"暖橙番茄意面",tone:"warm",items:"番茄 洋葱 橄榄油 意面",steps:"洋葱炒香后加入番茄煮成酱汁 再拌入煮好的意面"},{name:"烤椒芝士吐司",tone:"warm",items:"彩椒 芝士 吐司 黑胡椒",steps:"彩椒切丝铺在吐司上 加芝士烘烤至表面金黄"},{name:"南瓜香料浓汤",tone:"warm",items:"南瓜 洋葱 牛奶 肉桂",steps:"南瓜蒸熟后与炒香洋葱打碎 加牛奶煮热调味"},{name:"薄荷青柠沙拉",tone:"cool",items:"黄瓜 薄荷 青柠汁 橄榄油",steps:"黄瓜切片后加入薄荷和青柠汁 拌匀冷藏十分钟"},{name:"青柠酸奶杯",tone:"cool",items:"酸奶 青柠 燕麦 蜂蜜",steps:"酸奶加入青柠皮屑 分层放入燕麦和蜂蜜"},{name:"紫甘蓝脆沙拉",tone:"cool",items:"紫甘蓝 苹果 醋 橄榄油",steps:"食材切丝后加入醋和橄榄油拌匀 静置五分钟"}];function show(r,g,b){swatch.style.background=`rgb(${r},${g},${b})`;const list=r>g*1.3&&r>b*1.3?recipes.filter(x=>x.tone==="warm"):recipes.filter(x=>x.tone==="cool");name.textContent=list[0].name;recipe.innerHTML=list.map(x=>`<strong>${x.name}</strong>${x.items}<br>${x.steps}`).join("<hr>")}recognize.onclick=()=>{if(!streamReady)return;const c=document.createElement("canvas"),x=c.getContext("2d");c.width=160;c.height=100;x.drawImage(cam,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;let r=0,g=0,b=0,n=d.length/4;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}show(Math.round(r/n),Math.round(g/n),Math.round(b/n));msg.textContent="识别成功 颜色结果已固定"};go.onclick=async()=>{try{cam.srcObject=await navigator.mediaDevices.getUserMedia({video:true});streamReady=true;recognize.disabled=false;msg.textContent="摄像头连接成功 可以开始识别"}catch(e){msg.textContent="摄像头连接失败 请检查权限"}};</script></html>
